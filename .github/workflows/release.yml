#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * passes those artifacts between jobs via actions/cache (run-scoped keys)
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
# Least-privilege default: read-only for the workflow so the build jobs (where
# untrusted Cargo build scripts compile) never see a repo-write token. Only the
# publication jobs (`plan` creates the release draft, `host` creates the
# release) opt into `contents: write` below. NOTE: cargo-dist regenerates this
# file — re-apply this scoping if you re-run `dist generate-ci`.
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    # Publishing: `dist host --steps=create` creates the GitHub release draft.
    permissions:
      contents: write
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      # Pass the plan manifest to the build jobs through the Actions cache
      # service (run-scoped key) instead of artifact storage, which is quota-
      # blocked in this org (APT-1002). enableCrossOsArchive is required: the
      # windows build job restores this ubuntu-saved entry, and without it the
      # cache version hash would differ between the two platforms.
      - name: "Cache dist-manifest.json"
        uses: actions/cache/save@v4
        with:
          key: dist-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan-dist-manifest.json
          enableCrossOsArchive: true

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    # HAND-MAINTAINED divergence from dist's template: run the build jobs on
    # pull_request too (publishing stays off), so a build-only run can prove
    # the pipeline without cutting a release. dist's pr_run_mode defaults to
    # "plan", which skips them.
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || github.event.pull_request) }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    # No GH_TOKEN here: this job compiles dependencies (untrusted build.rs runs);
    # it only passes outputs to later jobs via the Actions cache, never to the
    # GitHub release.
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest from the plan job via the Actions cache service
      # (run-scoped key) instead of artifact storage (APT-1002). A miss here
      # means the transport lost the plan manifest, so fail loudly. The path
      # string must equal the plan job's save path: it feeds the cache
      # version hash on both sides.
      - name: Fetch plan manifest
        uses: actions/cache/restore@v4
        with:
          key: dist-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan-dist-manifest.json
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Move plan manifest into place
        shell: bash
        run: |
          mkdir -p target/distrib
          mv plan-dist-manifest.json target/distrib/
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # Hand everything this job built to the global and host jobs via the
      # Actions cache service (run-scoped key) instead of artifact storage
      # (APT-1002). enableCrossOsArchive is required: this entry is saved on
      # windows for one target and restored on ubuntu. The path string must
      # equal the restore path in the global and host jobs: it feeds the
      # cache version hash on both sides.
      - name: "Cache artifacts"
        uses: actions/cache/save@v4
        with:
          key: dist-local-${{ join(matrix.targets, '-') }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    # No GH_TOKEN here: global artifacts (checksums/installers) only read local
    # artifacts and pass outputs to the host job via the Actions cache, never
    # to the release.
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      # Get the plan manifest and all local artifacts from the plan and
      # build-local jobs via the Actions cache service (run-scoped keys)
      # instead of artifact storage (APT-1002). Each restore fails loudly on
      # a miss: a lost plan manifest or local artifact would corrupt the
      # global build (the unified sha256.sum reads checksum values from the
      # local manifests).
      - name: Fetch plan manifest
        uses: actions/cache/restore@v4
        with:
          key: dist-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan-dist-manifest.json
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Move plan manifest into place
        run: |
          mkdir -p target/distrib
          mv plan-dist-manifest.json target/distrib/
      - name: Fetch local artifacts
        uses: actions/cache/restore@v4
        with:
          key: dist-local-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch local artifacts (aarch64-unknown-linux-gnu)
        uses: actions/cache/restore@v4
        with:
          key: dist-local-aarch64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch local artifacts (x86_64-apple-darwin)
        uses: actions/cache/restore@v4
        with:
          key: dist-local-x86_64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch local artifacts (aarch64-apple-darwin)
        uses: actions/cache/restore@v4
        with:
          key: dist-local-aarch64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch local artifacts (x86_64-pc-windows-msvc)
        uses: actions/cache/restore@v4
        with:
          key: dist-local-x86_64-pc-windows-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # Hand the global artifacts and manifest to the host job via the Actions
      # cache service (run-scoped key) instead of artifact storage (APT-1002).
      # The path string must equal the host job's restore path: it feeds the
      # cache version hash on both sides.
      - name: "Cache artifacts"
        uses: actions/cache/save@v4
        with:
          key: dist-global-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if plan, local and global didn't fail (skipped is fine).
    # HAND-MAINTAINED divergence from dist's template: also run on pull_request
    # so a build-only run exercises the host path; the Create GitHub Release
    # step below stays gated on publishing, so a PR run can never publish.
    if: ${{ always() && needs.plan.result == 'success' && (needs.plan.outputs.publishing == 'true' || github.event.pull_request) && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    # Publication: uploads assets and creates the GitHub Release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      # Fetch the plan manifest and every build job's artifacts from the
      # Actions cache service (run-scoped keys) instead of artifact storage
      # (APT-1002). Each restore fails loudly on a miss: the host step and
      # the gh release create below need the complete set.
      - name: Fetch plan manifest
        uses: actions/cache/restore@v4
        with:
          key: dist-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan-dist-manifest.json
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Move plan manifest into place
        run: |
          mkdir -p target/distrib
          mv plan-dist-manifest.json target/distrib/
      - name: Fetch local artifacts
        uses: actions/cache/restore@v4
        with:
          key: dist-local-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch local artifacts (aarch64-unknown-linux-gnu)
        uses: actions/cache/restore@v4
        with:
          key: dist-local-aarch64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch local artifacts (x86_64-apple-darwin)
        uses: actions/cache/restore@v4
        with:
          key: dist-local-x86_64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch local artifacts (aarch64-apple-darwin)
        uses: actions/cache/restore@v4
        with:
          key: dist-local-aarch64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch local artifacts (x86_64-pc-windows-msvc)
        uses: actions/cache/restore@v4
        with:
          key: dist-local-x86_64-pc-windows-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Fetch global artifacts
        uses: actions/cache/restore@v4
        with:
          key: dist-global-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      # Gather everything the release carries from target/distrib, where the
      # restores above and `dist host` put it, instead of artifact storage
      # (APT-1002). The workspace-root dist-manifest.json (dist's own stdout,
      # trailing newline included) is the published manifest, matching what
      # the artifact-storage flow uploaded; dist also saves a copy without
      # the newline into target/distrib, so exclude it here.
      - name: "Gather release artifacts"
        run: |
          mkdir -p artifacts
          find target/distrib -maxdepth 1 -type f ! -name dist-manifest.json -exec cp -t artifacts/ {} +
          cp dist-manifest.json artifacts/
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        # HAND-MAINTAINED: publishing-only gate. PR runs exercise everything
        # above this step without creating a release.
        if: ${{ needs.plan.outputs.publishing == 'true' }}
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          REPO: "cloudthinker-ai/cloudthinker-cli"
          RELEASE_COMMIT: "${{ fromJson(steps.host.outputs.manifest).ci.github.external_repo_commit }}"
          # We need to ensure `gh` uses the token that can auth
          # to the external repo instead of the runner token.
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --repo "$REPO" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
