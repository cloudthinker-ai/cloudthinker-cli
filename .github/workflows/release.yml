# and is now HAND-MAINTAINED. Do not rerun `dist generate-ci` over it: this repo
# carries deliberate hardening that regeneration would revert (least-privilege
# permission scoping, external release repo, inter-job transport via
# actions/cache instead of GitHub Actions artifact storage, which hit a stale
# quota error in 2026-09 — APT-1002, and build jobs plus host running on
# pull_request so a build-only run can prove the pipeline; the Create GitHub
# Release step stays gated on publishing). Re-apply changes by hand.
# allow-dirty = ["ci"] in dist-workspace.toml keeps dist's consistency check
