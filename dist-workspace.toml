[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# release.yml is deliberately hardened beyond dist's generated defaults (least-privilege
# permissions scoping, re-applied after every `dist generate-ci`); allow-dirty keeps dist's
# consistency check from rejecting the hand-scoped CI file.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
github-releases-repo = "cloudthinker-ai/cloudthinker-cli"
source-tarball = false
# curl one-liner (install.sh) is primary; PowerShell covers the Windows target.
# Homebrew is deferred — it needs a separate `cloudthinker-ai/homebrew-tap` repo.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Install to a Rust-independent location (customers may not have cargo); the
# installer appends it to PATH.
install-path = "~/.local/bin"

# The @cloudthinker/agent tarballs ride this release. The build script path resolves
# against the release mirror, whose root is this monorepo's cli/ directory, so
# agent-cli/ sits beside crates/ there and nowhere in the monorepo.
[[dist.extra-artifacts]]
build = ["bash", "agent-cli/scripts/release-artifacts.sh"]
artifacts = [
    "agent-cli/packages/agent/dist/cloudthinker-agent-aarch64-apple-darwin.tar.gz",
    "agent-cli/packages/agent/dist/cloudthinker-agent-aarch64-apple-darwin.tar.gz.sha256",
    "agent-cli/packages/agent/dist/cloudthinker-agent-x86_64-apple-darwin.tar.gz",
    "agent-cli/packages/agent/dist/cloudthinker-agent-x86_64-apple-darwin.tar.gz.sha256",
    "agent-cli/packages/agent/dist/cloudthinker-agent-aarch64-unknown-linux-gnu.tar.gz",
    "agent-cli/packages/agent/dist/cloudthinker-agent-aarch64-unknown-linux-gnu.tar.gz.sha256",
    "agent-cli/packages/agent/dist/cloudthinker-agent-x86_64-unknown-linux-gnu.tar.gz",
    "agent-cli/packages/agent/dist/cloudthinker-agent-x86_64-unknown-linux-gnu.tar.gz.sha256",
    "agent-cli/packages/agent/dist/cloudthinker-agent-sha256.sum",
]
