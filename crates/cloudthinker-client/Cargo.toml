[package]
name = "cloudthinker-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wire + auth layer for the CloudThinker CLI: the only hand-written crate that knows the API."

[lints]
workspace = true

[dependencies]
cloudthinker-api.workspace = true
cloudthinker-spec.workspace = true
axoupdater = "0.10"
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
url.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "query"] }
# `vendored` statically links libdbus into the Linux binary (via dbus-secret-service):
# the release runners have no `libdbus-1-dev`, and it keeps the published Linux archive
# self-contained instead of depending on the target's system libdbus.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
dirs = "6"
fs2 = "0.4"
cap-std = "4"
rustls-native-certs = "0.8"
rustls-webpki = { version = "0.103", default-features = false }
lzma-rs = { version = "=0.3.0", default-features = false }
homedir = "0.3.6"
quick-xml = { version = "0.42", features = ["serialize"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "test-util"] }
