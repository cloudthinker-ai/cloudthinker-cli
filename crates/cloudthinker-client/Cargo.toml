[package]
name = "cloudthinker-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wire + auth layer for the CloudThinker CLI: the only hand-written crate that knows the API."

[lints]
workspace = true

[dependencies]
cloudthinker-api.workspace = true
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
url.workspace = true
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "query"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "6"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
