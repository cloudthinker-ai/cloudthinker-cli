[package]
name = "cloudthinker-cli"
version = "0.5.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CloudThinker customer-facing CLI (login + headless chat)."

[[bin]]
name = "cloudthinker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cloudthinker-client.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rand.workspace = true
open = "5"
owo-colors = "4"
supports-color = "3"
# Self-update: the crate cargo-dist itself uses for its updater binary. The
# network lives inside axoupdater (GitHub releases API + installer download),
# so the "no reqwest in commands" rule stays intact for hand-written code.
axoupdater = "0.10"

[dev-dependencies]
assert_cmd = "2"
portable-pty = "0.9"
predicates = "3"
