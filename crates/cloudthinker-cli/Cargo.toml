[package]
name = "cloudthinker-cli"
version = "0.7.2-dev.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CloudThinker customer-facing CLI (login + headless chat)."

[[bin]]
name = "cloudthinker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cloudthinker-client.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rand.workspace = true
sha2.workspace = true
open = "5"
owo-colors = "4"
supports-color = "3"
indicatif = "0.18"
# Self-update: the crate cargo-dist itself uses for its updater binary. The
# network lives inside axoupdater (GitHub releases API + installer download),
# so the "no reqwest in commands" rule stays intact for hand-written code.
axoupdater = "0.10"

[target.'cfg(unix)'.dependencies]
chrono.workspace = true
base64.workspace = true
flate2.workspace = true
tar.workspace = true
cap-std = "4"
fs2 = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
globset = "0.4"
regex = "1"
rustix = { version = "1", features = ["process", "fs"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
portable-pty = "0.9"
predicates = "3"
